<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HackBridge - Multi-Stakeholder Hackathon Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        function signalStreamlitReady() {
          try {
            if (window.parent && window.parent !== window) {
              window.parent.postMessage({
                isStreamlitMessage: true,
                type: "streamlit:componentReady",
                apiVersion: 1
              }, "*");
              window.parent.postMessage({
                isStreamlitMessage: true,
                type: "streamlit:setFrameHeight",
                height: Math.max(window.innerHeight, 1080)
              }, "*");
            }
          } catch (e) {}
        }
        signalStreamlitReady();
        window.addEventListener("DOMContentLoaded", signalStreamlitReady);
        window.addEventListener("load", signalStreamlitReady);
        setTimeout(signalStreamlitReady, 50);
        setTimeout(signalStreamlitReady, 200);
        setTimeout(signalStreamlitReady, 600);
        setTimeout(signalStreamlitReady, 1200);

        // Auto-focus window on mouseenter/load so wheel scroll works immediately
        window.addEventListener("mouseenter", function() { window.focus(); });
        window.addEventListener("mouseover", function() {
          if (document.activeElement === document.body || !document.activeElement) {
            window.focus();
          }
        });
        window.addEventListener("load", function() { window.focus(); });

        // Listen for scroll messages from Streamlit parent if forwarded
        window.addEventListener("message", function(event) {
          if (event.data && event.data.type === "hackbridge:scroll") {
            window.scrollBy({ top: event.data.deltaY || 0, behavior: "auto" });
          }
        });
      })();
    </script>
    <style>
      html, body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow-y: auto !important;
        overflow-x: hidden !important;
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch;
      }
      #root {
        min-height: 100%;
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

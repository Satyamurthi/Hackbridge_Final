# ----------------------------------------------------------------------
# Rate Limit Zones (must be in http block - defined once, used by backend block)
# ----------------------------------------------------------------------
# NOTE: These must be in /etc/nginx/nginx.conf inside the http {} block,
# NOT in this file. If not already there, add them:
#
# limit_req_zone $binary_remote_addr zone=hackmitten_login_v3:10m rate=5r/m;
# limit_req_zone $binary_remote_addr zone=hackmitten_recovery_v3:10m rate=2r/m;


# ----------------------------------------------------------------------
# Frontend Server Block - Hackmitten
# Domain: hackmitten-3-0.mitt.edu.in
# ----------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;

    server_name hackmitten-3-0.mitt.edu.in;

    include /etc/nginx/mime.types;

    root /apps/frontend/out;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}


# ----------------------------------------------------------------------
# Backend API Server Block - Hackmitten
# Domain: hackmitten-3-0-api.mitt.edu.in
# ----------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;

    server_name hackmitten-3-0-api.mitt.edu.in;

    location = /api/auth/callback/credentials {
        limit_req zone=hackmitten_login_v3 burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /api/admin/credentials {
        limit_req zone=hackmitten_recovery_v3 burst=2 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}


# ----------------------------------------------------------------------
# Frontend Server Block - Hackbridge
# Domain: hackbridge.mitt.edu.in
# Document Root: /apps/hackbridge/Hackbridge_Final/dist  ← FIXED
# ----------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;

    server_name hackbridge.mitt.edu.in;

    # FIXED: was /var/www/hackbridge — actual build output is here
    root /apps/hackbridge/Hackbridge_Final/dist;
    index index.html;

    include /etc/nginx/mime.types;

    # Cache Vite-hashed assets for 1 year (filenames change on rebuild)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        try_files $uri =404;
    }

    # Backend API proxy (when HackBridge backend is running on port 4000)
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # SPA fallback — React Router requires this
    location / {
        try_files $uri $uri/ /index.html;
    }
}
